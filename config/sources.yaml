# The curated public publishing sites. Mirrors and software distribution sites
# are intentionally absent. The crawler only follows links on allowed_hosts.
sources:
  - id: news
    name: 中国科大新闻网
    organization_level: university
    seed_urls: [https://news.ustc.edu.cn/]
    allowed_hosts: [news.ustc.edu.cn]
  - id: university
    name: 中国科学技术大学
    organization_level: university
    seed_urls: [https://www.ustc.edu.cn/]
    allowed_hosts: [www.ustc.edu.cn]
    # Theme/aggregation pages on the university homepage (e.g. the education
    # campaign subsite) embed many inline CMS images. Keep the article but cap
    # the number of images downloaded per page.
    max_images_per_page: 5
  - id: library
    name: 中国科大图书馆
    organization_level: service
    seed_urls: [https://lib.ustc.edu.cn/]
    allowed_hosts: [lib.ustc.edu.cn]
    # Wanfang's journal-data mirror is linked from the library but is not an
    # official USTC publishing site. Keep its discovered links, do not crawl
    # the third-party mirror pages.
    # The library links to many service/mirror subdomains. Keep the library
    # publication host itself, but do not recursively crawl those products.
    blocked_hosts:
      - wfo.lib.ustc.edu.cn
      - career.lib.ustc.edu.cn
      - fanglue.lib.ustc.edu.cn
      - skl.lib.ustc.edu.cn
      - yuanlai.lib.ustc.edu.cn
      - en.lib.ustc.edu.cn
      - opac.lib.ustc.edu.cn
      - old.lib.ustc.edu.cn
      - chaxin.lib.ustc.edu.cn
      - app.lib.ustc.edu.cn
      - lekao.lib.ustc.edu.cn
      - thesis-submit.lib.ustc.edu.cn
      - bookan.lib.ustc.edu.cn
      - cnki.lib.ustc.edu.cn
      - cssl.lib.ustc.edu.cn
      - ic.lib.ustc.edu.cn
      - lecture.lib.ustc.edu.cn
      - liser.lib.ustc.edu.cn
      - wx.lib.ustc.edu.cn
      - ztd.lib.ustc.edu.cn
      - hs.lib.ustc.edu.cn
      - icdd.lib.ustc.edu.cn
      - start.lib.ustc.edu.cn
