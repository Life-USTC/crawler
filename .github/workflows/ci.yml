name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crawler
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Life-USTC/server
          path: server
      - name: Verify shared ingestion fixture
        run: |
          python -c 'import json, pathlib; left=json.loads(pathlib.Path("crawler/tests/fixtures/ingestion_batch.json").read_text()); right=json.loads(pathlib.Path("server/tests/fixtures/publication-batch.json").read_text()); assert left == right'
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts alembic
      - run: uv run ruff format --check src tests scripts alembic
      - run: uv run pytest -q
      - run: uv run ustc-crawler --help
      - run: uv build
