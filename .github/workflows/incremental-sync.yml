name: Incremental sync

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      reindex:
        description: "Re-extract saved pages for adapter-covered sources and enqueue changed articles before sync"
        type: boolean
        default: false
      retext:
        description: "Recompute article body_text from stored body_html and enqueue changed articles before sync"
        type: boolean
        default: false
      rebuild_markdown:
        description: "Rebuild Markdown and current-format sync events from every archived article before sync"
        type: boolean
        default: false
      rebuild_after_url:
        description: "Exclusive article URL cursor when resuming a Markdown rebuild"
        type: string
        default: ""
      rebuild_limit:
        description: "Maximum archived articles to rebuild (0 = all); use with rebuild_after_url for chunks"
        type: string
        default: "0"
      requeue_failed:
        description: "Release events from locally failed batches (e.g. immutable_object_changed) back to the pending outbox before sync"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: incremental-sync
  cancel-in-progress: false

env:
  SEED_RELEASE_TAG: crawler-state-seed
  SEED_ASSET: crawler-seed.sqlite.zst
  DB_PATH: data/crawler.sqlite
  DB_ARCHIVE: crawler-state.sqlite.zst

jobs:
  sync:
    runs-on: ubuntu-latest
    # The large database previously needed about 10 minutes just to save.
    # Bound writer phases below and retain room for restore, shutdown and save.
    timeout-minutes: ${{ (inputs.reindex || inputs.retext || inputs.requeue_failed || inputs.rebuild_markdown) && 300 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked

      - name: Validate sync configuration
        id: validate
        env:
          REINDEX: ${{ inputs.reindex }}
          RETEXT: ${{ inputs.retext }}
          REBUILD_MARKDOWN: ${{ inputs.rebuild_markdown }}
          USTC_CRAWLER_SERVER: ${{ vars.CRAWLER_SERVER }}
          USTC_CRAWLER_INGESTION_SECRET: ${{ secrets.USTC_CRAWLER_INGESTION_SECRET }}
        run: |
          repairs=0
          for repair in "$REINDEX" "$RETEXT" "$REBUILD_MARKDOWN"; do
            if [ "$repair" = true ]; then repairs=$((repairs + 1)); fi
          done
          if [ "$repairs" -gt 1 ]; then
            echo '::error::Choose at most one of reindex, retext and rebuild_markdown per run'
            exit 1
          fi
          test -n "$USTC_CRAWLER_SERVER" || { echo "::error::vars.CRAWLER_SERVER is not set"; exit 1; }
          test -n "$USTC_CRAWLER_INGESTION_SECRET" || { echo "::error::ingestion secret is not set"; exit 1; }

      - name: Restore crawler state from cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DB_ARCHIVE }}
          key: crawler-state-${{ github.run_id }}
          restore-keys: crawler-state-

      - name: Download seed state on cache miss
        id: seed
        if: steps.restore.outputs.cache-matched-key == ''
        # Failure must not kill the job: the bootstrap step below turns a
        # missing seed into an empty database instead of a dead pipeline.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$SEED_RELEASE_TAG" --pattern "$SEED_ASSET" --output "$DB_ARCHIVE" --clobber

      - name: Bootstrap empty state when no seed is available
        # Cache entries are evicted after 7 days of no access and the seed
        # release can be deleted by hand; with both gone the pipeline would be
        # hard-dead. Store builds the schema itself, so falling back to an
        # empty database keeps the pipeline alive at the cost of a full
        # re-crawl of every source.
        if: steps.restore.outputs.cache-matched-key == '' && steps.seed.outcome == 'failure'
        run: |
          echo "::warning::cache miss and seed release $SEED_RELEASE_TAG/$SEED_ASSET unavailable; bootstrapping an empty database, this run is a FULL re-crawl"
          mkdir -p data
          rm -f "$DB_ARCHIVE"

      - name: Decompress state
        # Skipped entirely when neither cache nor seed produced an archive;
        # the db-upgrade below then creates a fresh schema.
        run: |
          if [ -f "$DB_ARCHIVE" ]; then
            mkdir -p data
            zstd -d "$DB_ARCHIVE" -o "$DB_PATH"
            rm "$DB_ARCHIVE"
          fi

      - name: Upgrade database schema
        # Must run before every Store consumer: Reindex/Retext/Requeue build a
        # Store, which asserts the alembic head, so a cached DB from before a
        # new migration crashes them (run 34939273807 hit exactly this when
        # 0005 landed). db-upgrade is idempotent; a failure here means the
        # schema is untrustworthy, so only exit 0 is acceptable.
        run: |
          uv run ustc-crawler db-upgrade 2>&1 | tee db-upgrade.log
          test "${PIPESTATUS[0]}" = 0

      - name: Reindex adapter-covered sources
        id: reindex
        if: inputs.reindex
        shell: bash
        run: |
          set +e
          # Reindex has no graceful SIGTERM handler: timeout is a failure,
          # so only a fully completed operation can replace the state cache.
          timeout --signal=TERM --kill-after=60s 90m \
            uv run ustc-crawler reindex \
            --source library \
            --source unit-mech-ustc-edu-cn \
            --source unit-iid-ustc-edu-cn \
            --source unit-iat-ustc-edu-cn \
            --source graduate-admissions \
            --source course 2>&1 | tee reindex.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2) ;; *) exit "${result[0]}" ;; esac
          timeout --signal=TERM --kill-after=60s 10m \
            uv run ustc-crawler sync-backfill 2>&1 | tee backfill.log

      - name: Retext article bodies
        id: retext
        if: inputs.retext
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 90m \
            uv run ustc-crawler retext 2>&1 | tee retext.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2) ;; *) exit "${result[0]}" ;; esac
          timeout --signal=TERM --kill-after=60s 10m \
            uv run ustc-crawler sync-backfill 2>&1 | tee backfill.log

      - name: Rebuild archived article Markdown
        id: rebuild
        if: inputs.rebuild_markdown
        shell: bash
        env:
          REBUILD_AFTER_URL: ${{ inputs.rebuild_after_url }}
          REBUILD_LIMIT: ${{ inputs.rebuild_limit }}
        # SIGTERM is handled by the CLI; forced SIGKILL (137) is unsafe.
        # Reserve time for optional repairs, crawling, sync and checkpointing.
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 90m \
            uv run ustc-crawler rebuild-markdown \
              --after-url "$REBUILD_AFTER_URL" --limit "$REBUILD_LIMIT" 2>&1 | tee rebuild-markdown.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2|124) ;; *) exit "${result[0]}" ;; esac

      - name: Requeue locally failed batches
        id: requeue
        if: inputs.requeue_failed
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 5m \
            uv run ustc-crawler sync-requeue-failed 2>&1 | tee requeue.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2) ;; *) exit "${result[0]}" ;; esac

      - name: Crawl
        id: crawl
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s 8m \
            uv run ustc-crawler crawl --incremental 2>&1 | tee crawl.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2|124) ;; *) exit "${result[0]}" ;; esac

      - name: Sync
        id: sync
        shell: bash
        env:
          USTC_CRAWLER_SERVER: ${{ vars.CRAWLER_SERVER }}
          USTC_CRAWLER_INGESTION_SECRET: ${{ secrets.USTC_CRAWLER_INGESTION_SECRET }}
          SYNC_BUDGET_MINUTES: ${{ inputs.rebuild_markdown && 70 || (inputs.reindex || inputs.retext || inputs.requeue_failed) && 160 || 30 }}
        # Capture completed partial/timeout results without failing this step:
        # checkpoint and save their progress before the final job status gate.
        run: |
          set +e
          timeout --signal=TERM --kill-after=60s "${SYNC_BUDGET_MINUTES}m" \
            uv run ustc-crawler sync 2>&1 | tee sync.log
          result=("${PIPESTATUS[@]}")
          set -e
          test "${result[1]}" = 0
          echo "exit_code=${result[0]}" >> "$GITHUB_OUTPUT"
          case "${result[0]}" in 0|2|124) ;; *) exit "${result[0]}" ;; esac

      - name: Report non-terminal sync state
        id: diagnostics
        # Diagnose through a read-only stdlib sqlite3 connection, not Store:
        # Store.__init__ asserts the alembic head, so a db-upgrade that died
        # halfway (the exact moment diagnostics matter most) would crash this
        # step and produce no artifacts at all. continue-on-error keeps one
        # broken query from costing the rest of the report.
        if: always()
        continue-on-error: true
        env:
          REINDEX_EXIT: ${{ steps.reindex.outputs.exit_code }}
          RETEXT_EXIT: ${{ steps.retext.outputs.exit_code }}
          REBUILD_EXIT: ${{ steps.rebuild.outputs.exit_code }}
          REQUEUE_EXIT: ${{ steps.requeue.outputs.exit_code }}
          CRAWL_EXIT: ${{ steps.crawl.outputs.exit_code }}
          SYNC_EXIT: ${{ steps.sync.outputs.exit_code }}
        run: |
          {
            echo '## Crawler synchronization'
            echo '| Command | Exit code (0 clean, 2 partial, 124 timeout) |'
            echo '| --- | --- |'
            for command in REINDEX RETEXT REBUILD REQUEUE CRAWL SYNC; do
              key="${command}_EXIT"
              echo "| $command | ${!key:-not completed} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$DB_PATH" ]; then
            sqlite3 -header -column "file:$DB_PATH?mode=ro" \
              "SELECT substr(created_at,1,16) AS created, status, last_error, attempts FROM sync_batches WHERE status NOT IN ('acked','superseded') ORDER BY created_at DESC LIMIT 20;" || true
            mkdir -p diag
            uv run python - "$DB_PATH" <<'PY'
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path

          db_path = sys.argv[1]
          conn = sqlite3.connect(f"file:{db_path}?mode=ro", uri=True)
          Path("diag").mkdir(exist_ok=True)
          try:
              rows = conn.execute(
                  """SELECT id, status, last_error, attempts FROM sync_batches
                     WHERE status NOT IN ('acked','superseded')
                     ORDER BY created_at DESC"""
              ).fetchall()
              Path("diag/batches.json").write_text(
                  json.dumps(
                      [
                          {"id": r[0], "status": r[1], "last_error": r[2], "attempts": r[3]}
                          for r in rows
                      ],
                      indent=2,
                      ensure_ascii=False,
                  )
              )
          except Exception as exc:
              Path("diag/batches.error.txt").write_text(f"{type(exc).__name__}: {exc}")
          try:
              counts = conn.execute(
                  "SELECT status, COUNT(*) FROM sync_outbox GROUP BY status"
              ).fetchall()
              counts = dict(counts)
              Path("diag/outbox-counts.json").write_text(json.dumps(counts, indent=2))
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"pending={counts.get('pending', 0)}\n")
                  output.write(f"failed={counts.get('failed', 0)}\n")
                  output.write(f"unfinished={sum(counts.get(s, 0) for s in ('pending', 'batched', 'uploading'))}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write("\nOutbox counts: " + json.dumps(counts) + "\n")
          except Exception as exc:
              Path("diag/outbox-counts.error.txt").write_text(f"{type(exc).__name__}: {exc}")
          try:
              rows = conn.execute(
                  """SELECT event_id, entity_key, last_error FROM sync_outbox
                     WHERE status = 'failed' AND batch_id IS NULL
                     ORDER BY updated_at DESC LIMIT 100"""
              ).fetchall()
              Path("diag/failed-events.json").write_text(
                  json.dumps(
                      [{"event_id": r[0], "entity_key": r[1], "error": r[2]} for r in rows],
                      indent=2,
                      ensure_ascii=False,
                  )
              )
          except Exception as exc:
              Path("diag/failed-events.error.txt").write_text(f"{type(exc).__name__}: {exc}")
          conn.close()
          PY
          fi

      - name: Save crawler state
        id: compress
        # Only controlled command completion is saveable. Unexpected failures,
        # forced kills and workflow cancellation must retain the previous cache.
        if: always() && ! failure() && ! cancelled() && steps.sync.outcome == 'success'
        run: |
          if [ -f "$DB_PATH" ]; then
            # wal_checkpoint returns exit 0 even when busy, so check the row:
            # only 0|0|0 (not busy, fully checkpointed, truncated) is safe.
            checkpoint="$(sqlite3 "$DB_PATH" "PRAGMA wal_checkpoint(TRUNCATE);")"
            if [ "$checkpoint" != "0|0|0" ]; then
              echo "::error::wal_checkpoint(TRUNCATE) returned '$checkpoint', refusing to save a live database"
              exit 1
            fi
            integrity="$(sqlite3 "$DB_PATH" "PRAGMA integrity_check;")"
            if [ "$integrity" != "ok" ]; then
              echo "::error::integrity_check reported '$integrity'; refusing to replace the last good cache entry"
              exit 1
            else
              cp --reflink=auto "$DB_PATH" state-snapshot.sqlite
              zstd -f state-snapshot.sqlite -o "$DB_ARCHIVE"
              rm -f state-snapshot.sqlite
            fi
          fi
          echo "exists=$([ -f "$DB_ARCHIVE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload state to cache
        if: always() && ! failure() && ! cancelled() && steps.compress.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DB_ARCHIVE }}
          key: crawler-state-${{ github.run_id }}

      - name: Require complete synchronization
        if: always() && ! cancelled()
        env:
          REINDEX_EXIT: ${{ steps.reindex.outputs.exit_code }}
          RETEXT_EXIT: ${{ steps.retext.outputs.exit_code }}
          REBUILD_EXIT: ${{ steps.rebuild.outputs.exit_code }}
          REQUEUE_EXIT: ${{ steps.requeue.outputs.exit_code }}
          CRAWL_EXIT: ${{ steps.crawl.outputs.exit_code }}
          SYNC_EXIT: ${{ steps.sync.outputs.exit_code }}
          PENDING: ${{ steps.diagnostics.outputs.pending }}
          UNFINISHED: ${{ steps.diagnostics.outputs.unfinished }}
        run: |
          result=0
          for command in REINDEX RETEXT REBUILD REQUEUE; do
            key="${command}_EXIT"
            if [ -n "${!key}" ] && [ "${!key}" != 0 ]; then
              echo "::error::$command completed with exit code ${!key}"
              result=1
            fi
          done
          case "$CRAWL_EXIT" in
            0) ;;
            2) echo '::warning::Crawl completed with per-source errors; see crawl.log' ;;
            *) echo "::error::Crawl did not complete: ${CRAWL_EXIT:-unavailable}"; result=1 ;;
          esac
          for key in SYNC_EXIT PENDING UNFINISHED; do
            if [ "${!key}" != 0 ]; then
              echo "::error::$key=${!key:-unavailable}; synchronization is incomplete"
              result=1
            fi
          done
          exit "$result"

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diag-${{ github.run_id }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-sync-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 14
