name: Incremental sync

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      reindex:
        description: "Re-extract saved pages for adapter-covered sources and enqueue changed articles before sync"
        type: boolean
        default: false
      retext:
        description: "Recompute article body_text from stored body_html and enqueue changed articles before sync"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: incremental-sync
  cancel-in-progress: false

env:
  SEED_RELEASE_TAG: crawler-state-seed
  SEED_ASSET: crawler-seed.sqlite.zst
  DB_PATH: data/crawler.sqlite
  DB_ARCHIVE: crawler-state.sqlite.zst

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.reindex || inputs.retext) && 240 || 45 }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --locked

      - name: Restore crawler state from cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DB_ARCHIVE }}
          key: crawler-state-${{ github.run_id }}
          restore-keys: crawler-state-

      - name: Download seed state on cache miss
        if: steps.restore.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$SEED_RELEASE_TAG" --pattern "$SEED_ASSET" --output "$DB_ARCHIVE" --clobber

      - name: Decompress state
        run: |
          mkdir -p data
          zstd -d "$DB_ARCHIVE" -o "$DB_PATH"
          rm "$DB_ARCHIVE"

      - name: Reindex adapter-covered sources
        if: inputs.reindex
        run: |
          uv run ustc-crawler reindex \
            --source library \
            --source unit-mech-ustc-edu-cn \
            --source unit-iid-ustc-edu-cn \
            --source unit-iat-ustc-edu-cn \
            --source graduate-admissions \
            --source course 2>&1 | tee reindex.log
          uv run ustc-crawler sync-backfill 2>&1 | tee backfill.log

      - name: Retext article bodies
        if: inputs.retext
        run: |
          uv run ustc-crawler retext 2>&1 | tee retext.log
          uv run ustc-crawler sync-backfill 2>&1 | tee backfill.log

      - name: Crawl and sync
        env:
          USTC_CRAWLER_INGESTION_SECRET: ${{ secrets.USTC_CRAWLER_INGESTION_SECRET }}
          # End sync on its own before the job timeout so the always() state
          # save below runs against a quiet database instead of a live writer.
          SYNC_BUDGET_MINUTES: ${{ (inputs.reindex || inputs.retext) && 190 || 30 }}
        run: |
          uv run ustc-crawler db-upgrade 2>&1 | tee db-upgrade.log
          uv run ustc-crawler crawl --incremental 2>&1 | tee crawl.log
          timeout --signal=TERM --kill-after=60s "${SYNC_BUDGET_MINUTES}m" \
            uv run ustc-crawler sync --server "${{ vars.CRAWLER_SERVER }}" 2>&1 | tee sync.log
          test "${PIPESTATUS[0]}" = 0 -o "${PIPESTATUS[0]}" = 124

      - name: Report non-terminal sync state
        if: always()
        run: |
          if [ -f "$DB_PATH" ]; then
            sqlite3 -header -column "$DB_PATH" \
              "SELECT substr(created_at,1,16) AS created, status, last_error, attempts FROM sync_batches WHERE status NOT IN ('acked','superseded') ORDER BY created_at DESC LIMIT 20;"
            mkdir -p diag
            uv run python - <<'PY'
          import json
          from pathlib import Path
          from sqlalchemy import select
          from ustc_crawler.db.models import SyncBatch
          from ustc_crawler.store import Store
          from ustc_crawler.sync.outbox import IngestionOutbox

          store = Store("data/crawler.sqlite", "data")
          outbox = IngestionOutbox(store.database)
          with store.database.session_factory() as session:
              batches = session.scalars(
                  select(SyncBatch).where(SyncBatch.status.notin_(("acked", "superseded")))
              ).all()
              meta = [
                  {"id": b.id, "status": b.status, "last_error": b.last_error}
                  for b in batches
              ]
          Path("diag/batches.json").write_text(json.dumps(meta, indent=2))
          for b in meta:
              try:
                  batch = outbox.build_batch(
                      run_id="diag",
                      batch_id=b["id"],
                      producer_version="diag",
                      observed_at="2026-01-01T00:00:00+08:00",
                  )
              except Exception as exc:
                  Path(f"diag/{b['id']}.error.txt").write_text(
                      f"{type(exc).__name__}: {exc}"
                  )
                  continue
              if batch is None:
                  Path(f"diag/{b['id']}.error.txt").write_text("batch rebuild returned None")
                  continue
              Path(f"diag/{b['id']}.json").write_bytes(batch.payload_bytes())
          store.close()
          PY
          fi

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-diag-${{ github.run_id }}
          path: diag/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save crawler state
        id: compress
        if: always()
        run: |
          if [ -f "$DB_PATH" ]; then
            sqlite3 "$DB_PATH" "PRAGMA wal_checkpoint(TRUNCATE);"
            cp --reflink=auto "$DB_PATH" state-snapshot.sqlite
            zstd -f state-snapshot.sqlite -o "$DB_ARCHIVE"
            rm -f state-snapshot.sqlite
          fi
          echo "exists=$([ -f "$DB_ARCHIVE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload state to cache
        if: always() && steps.compress.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DB_ARCHIVE }}
          key: crawler-state-${{ github.run_id }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-sync-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 14
